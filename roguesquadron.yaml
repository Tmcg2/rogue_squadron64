name: Rogue Squadron (North America)
sha1: ed42eed1ee2db646ff7ef94ba8c5421d164a4f0d
options:
  basename: roguesquadron
  target_path: rogue_squadron.z64
  elf_path: build/roguesquadron.elf
  base_path: .
  platform: n64
  compiler: KMC

  # asm_path: asm
  # src_path: src
  # build_path: build
  # create_asm_dependencies: True

  ld_script_path: roguesquadron.ld
  ld_dependencies: True

  find_file_boundaries: True
  header_encoding: ASCII

  o_as_suffix: True
  use_legacy_include_asm: False
  mips_abi_float_regs: o32

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel

  ld_legacy_generation: True
  # section_order: [".text", ".data", ".rodata", ".bss"]
  # auto_all_sections: [".data", ".rodata", ".bss"]

  symbol_addrs_path:
    - symbol_files/cinematic_overlay.txt
    - symbol_files/libultra.txt
    - symbol_files/main_overlay.txt
    - symbol_files/menu_overlay.txt
    - symbol_files/mission_overlay.txt
    - symbol_files/zlib.txt
    - symbol_files/ignored_symbols.txt
  reloc_addrs_path:
    - reloc_addrs.txt

  symbol_name_format: "$SEG_$VRAM"

  # undefined_funcs_auto_path: undefined_funcs_auto.txt
  # undefined_syms_auto_path: undefined_syms_auto.txt

  extensions_path: tools/splat_ext

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  # libultra_symbols: True
  # hardware_regs: True
  # gfx_ucode: # one of [f3d, f3db, f3dex, f3dexb, f3dex2]

segments:
  - name: header
    type: header
    start: 0x0

  - name: boot
    type: code
    start: 0x40
    vram: 0xA4000040
    subsegments:
      - [0x40, ipl3, ipl3_entry]
      - [0xB70, bin, ipl3_font]

  - name: entry
    type: code
    start: 0x1000
    vram: 0x80000400
    subsegments:
      - [0x1000, hasm, entry_point]

  - name: main
    type: code
    start: 0x01040
    vram: 0x80000440
    follows_vram: entry
    subsegments:
      - [0x01040, .rodata,  "main/01720"]
      - [0x01050, .rodata,  "main/03310"]
      - [0x01060, rodata,  "main/01060"] # Should be tied to 033C0, but that isn't playing nice for some reason :(
      - [0x01070, rodata,  "main/01070"]
      - [0x01080, rodata,  "main/01080"]
      - [0x01100, rodata,  "main/01100"]
